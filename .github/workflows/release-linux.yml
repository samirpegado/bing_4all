name: Release Linux packages

# Padrão usual: push de tag vX.Y.Z → build → GitHub Release com anexos
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Só buildar artefatos (não publicar release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build deb / rpm / tarball
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            dpkg-dev rpm xz-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version from tag / pubspec
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          pubspec_version="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          version="${pubspec_version%%+*}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            tag_version="${tag#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Aviso: tag $tag != pubspec $version (usando tag para o nome do release)"
            fi
            version="$tag_version"
          else
            tag="v${version}"
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Linux packages
        run: |
          chmod +x scripts/build_linux_packages.sh
          ./scripts/build_linux_packages.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ steps.meta.outputs.version }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/arch/PKGBUILD
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.skip_publish == false)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          notes="$(mktemp)"
          cat > "$notes" <<EOF
          ## Bing 4All ${VERSION}

          Pacotes Linux para instalação simples:

          | Arquivo | Distro |
          |---------|--------|
          | \`bing-4all_${VERSION}_amd64.deb\` | Debian / Ubuntu / Mint |
          | \`bing-4all-${VERSION}-*.rpm\` | Fedora / RHEL / openSUSE |
          | \`bing-4all-${VERSION}-linux-x64.tar.gz\` | Qualquer (portável / Arch) |

          ### Instalação rápida

          **Debian/Ubuntu**
          \`\`\`bash
          sudo apt install ./bing-4all_${VERSION}_amd64.deb
          \`\`\`

          **Fedora**
          \`\`\`bash
          sudo dnf install ./bing-4all-${VERSION}-*.rpm
          \`\`\`

          **Tarball**
          \`\`\`bash
          tar -xzf bing-4all-${VERSION}-linux-x64.tar.gz
          cd bing-4all-${VERSION}-linux-x64
          ./install.sh   # opcional (~/.local)
          # ou: ./bing_4all
          \`\`\`

          Confira integridade com \`SHA256SUMS\`.
          EOF

          assets=(dist/*.deb dist/*.tar.gz dist/SHA256SUMS)
          if compgen -G 'dist/*.rpm' > /dev/null; then
            assets+=(dist/*.rpm)
          fi

          prerelease_args=()
          latest_args=(--latest)
          if [[ "$VERSION" == *-* ]]; then
            # ex.: 1.0.0-beta.1, 1.0.0-rc.1 → pré-release (não vira "Latest")
            prerelease_args=(--prerelease)
            latest_args=()
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file "$notes" \
              "${prerelease_args[@]}" "${latest_args[@]}"
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Bing 4All ${VERSION}" \
              --notes-file "$notes" \
              "${prerelease_args[@]}" "${latest_args[@]}"
          fi

